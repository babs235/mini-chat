---
- name: Deploy Mini-Chat Application
  hosts: mini_chat_servers
  become: yes

  tasks:
    - name: mettre a jour les paquets
      apt:
        update_cache: yes
        upgrade: dist

    - name: installer docker et les outils
      apt:
        name:
          - docker.io
          - docker-compose
          - git
          - awscli
        state: present

    - name: ajouter l'utilisateur au groupe docker
      user:
        name: ubuntu
        groups: docker
        append: yes
    
    - name: activer docker
      service:
        name: docker
        enabled: yes
        state: started
  
    - name: cloner le repository
      git:
        repo: https://github.com/babs235/mini-chat.git
        dest: /home/ubuntu/mini-chat
        version: main
        force: yes

    - name: nettoyer docker pour liberer de l'espace
      shell: |
        docker system prune -af
        docker volume prune -f
        docker image prune -af

    - name: lancer docker-compose
      shell: |
        cd /home/ubuntu/mini-chat/docker
        docker-compose down
        docker-compose up -d --build

    - name: verifier les conteneurs
      shell: docker ps
      register: docker_status
    
    - name: afficher les conteneurs
      debug:
        var: docker_status.stdout_lines