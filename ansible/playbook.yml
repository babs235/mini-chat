---
- name: Deploy Mini-Chat Infrastructure
  hosts: localhost
  connection: local
  become: yes
  vars:
    project_dir: "/opt/minichat"
    docker_dir: "{{ project_dir }}/docker"
    backend_dir: "{{ project_dir }}/backend"
    database_dir: "{{ project_dir }}/database"
    docs_dir: "{{ project_dir }}/docs"

  tasks:
    # === INSTALLATION DOCKER ===
    - name: Update apt cache
      apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Install Docker dependencies
      apt:
        name:
          - apt-transport-https
          - ca-certificates
          - curl
          - gnupg
          - lsb-release
        state: present

    - name: Add Docker GPG key
      apt_key:
        url: https://download.docker.com/linux/ubuntu/gpg
        state: present

    - name: Add Docker repository
      apt_repository:
        repo: "deb [arch=amd64] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
        state: present

    - name: Install Docker Engine
      apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-compose-plugin
        state: present

    - name: Start and enable Docker service
      service:
        name: docker
        state: started
        enabled: yes

    - name: Add current user to docker group
      user:
        name: "{{ ansible_user_id }}"
        groups: docker
        append: yes

    # === CREATION REPERTOIRES ===
    - name: Create all project directories
      file:
        path: "{{ item }}"
        state: directory
        mode: '0755'
      loop:
        - "{{ project_dir }}"
        - "{{ docker_dir }}"
        - "{{ backend_dir }}"
        - "{{ backend_dir }}/src"
        - "{{ backend_dir }}/frontend"
        - "{{ database_dir }}"
        - "{{ docs_dir }}"

    # === COPIE DOCKER ===
    - name: Copy docker-compose.yml
      copy:
        src: "{{ playbook_dir }}/../docker/docker-compose.yml"
        dest: "{{ docker_dir }}/docker-compose.yml"
        mode: '0644'

    - name: Copy prometheus.yml
      copy:
        src: "{{ playbook_dir }}/../docker/prometheus.yml"
        dest: "{{ docker_dir }}/prometheus.yml"
        mode: '0644'

    # === COPIE BACKEND (fichiers individuels) ===
    - name: Copy backend root files
      copy:
        src: "{{ playbook_dir }}/../backend/{{ item }}"
        dest: "{{ backend_dir }}/{{ item }}"
        mode: '0644'
      loop:
        - package.json
        - package-lock.json
        - server.js
        - dockerfile.backend

    - name: Copy backend src directory
      copy:
        src: "{{ playbook_dir }}/../backend/src/"
        dest: "{{ backend_dir }}/src/"
        mode: '0644'

    - name: Copy backend frontend directory
      copy:
        src: "{{ playbook_dir }}/../backend/frontend/"
        dest: "{{ backend_dir }}/frontend/"
        mode: '0644'

    # === COPIE DATABASE ===
    - name: Copy database init script
      copy:
        src: "{{ playbook_dir }}/../database/init.sql"
        dest: "{{ database_dir }}/init.sql"
        mode: '0644'

    # === COPIE DOCS ===
    - name: Copy architecture diagram
      copy:
        src: "{{ playbook_dir }}/../docs/architecture.png"
        dest: "{{ docs_dir }}/architecture.png"
        mode: '0644'

    # === LANCEMENT APPLICATION ===
    - name: Start Docker Compose services
      command: docker compose up -d --build
      args:
        chdir: "{{ docker_dir }}"
      become: yes
      become_user: "{{ ansible_user_id }}"