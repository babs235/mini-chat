name: CI/CD Mini-Chat (GCP)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PROJECT_ID: mini-chat-asd
  REGION: europe-west1
  IMAGE: europe-west1-docker.pkg.dev/mini-chat-asd/mini-chat/backend

jobs:

  # ── JOB 1 : TESTS ────────────────────────────────────────────────
  tests:
    name: Tests unitaires
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: ./backend
        run: npm ci

      - name: Tests
        working-directory: ./backend
        run: npm test


  # ── JOB 2 : BUILD & PUSH ARTIFACT REGISTRY ───────────────────────
  build-push:
    name: Build and Push to Artifact Registry
    runs-on: ubuntu-latest
    needs: tests

    steps:
      - uses: actions/checkout@v4

      - name: Auth GCP
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          python3 - <<'EOF'
          import os, base64, json, sys
          raw = os.environ["GCP_SA_KEY"].strip()
          try:
              decoded = base64.b64decode(raw).decode("utf-8")
              json.loads(decoded)
              raw = decoded
          except Exception:
              pass
          with open("/tmp/sa-key.json", "w") as f:
              f.write(raw)
          EOF
          gcloud auth activate-service-account --key-file=/tmp/sa-key.json
          gcloud config set project $PROJECT_ID
          gcloud auth configure-docker $REGION-docker.pkg.dev --quiet

      - name: Build and push
        run: |
          docker build \
            -t $IMAGE:${{ github.sha }} \
            -t $IMAGE:latest \
            -f backend/dockerfile.backend \
            backend/
          docker push $IMAGE:${{ github.sha }}
          docker push $IMAGE:latest


  # ── JOB 3 : SMOKE TESTS (PRÉ-PROD) ──────────────────────────────
  smoke-tests:
    name: Smoke tests image Docker
    runs-on: ubuntu-latest
    needs: build-push

    steps:
      - name: Auth GCP
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          python3 - <<'EOF'
          import os, base64, json
          raw = os.environ["GCP_SA_KEY"].strip()
          try:
              decoded = base64.b64decode(raw).decode("utf-8")
              json.loads(decoded)
              raw = decoded
          except Exception:
              pass
          with open("/tmp/sa-key.json", "w") as f:
              f.write(raw)
          EOF
          gcloud auth activate-service-account --key-file=/tmp/sa-key.json
          gcloud config set project $PROJECT_ID
          gcloud auth configure-docker $REGION-docker.pkg.dev --quiet

      - name: Pull and start container
        run: |
          docker pull $IMAGE:${{ github.sha }}
          docker run -d \
            --name mini-chat-preprod \
            -p 3000:3000 \
            -e NODE_ENV=test \
            -e DB_HOST=127.0.0.1 \
            -e DB_USER=root \
            -e DB_NAME=mini_chat \
            -e DB_PASSWORD=test \
            -e JWT_SECRET=test_secret \
            $IMAGE:${{ github.sha }}
          for i in $(seq 1 10); do curl -sf http://localhost:3000/ && break; sleep 2; done

      - name: Smoke tests HTTP
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/)
          [ "$STATUS" = "200" ] || (echo "FAIL health: $STATUS" && exit 1)
          echo "OK  GET /  → 200"

          STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
            http://localhost:3000/auth/register \
            -H "Content-Type: application/json" -d '{}')
          [ "$STATUS" = "400" ] || (echo "FAIL validation: $STATUS" && exit 1)
          echo "OK  POST /auth/register {} → 400"

          STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/messages)
          [ "$STATUS" = "403" ] || (echo "FAIL JWT: $STATUS" && exit 1)
          echo "OK  GET /messages (no token) → 403"

      - name: Stop container
        if: always()
        run: docker rm -f mini-chat-preprod || true


  # ── JOB 4 : DEPLOY VIA TERRAFORM ─────────────────────────────────
  deploy:
    name: Deploy via Terraform
    runs-on: ubuntu-latest
    needs: smoke-tests

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.5'

      - name: Auth GCP
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          python3 - <<'EOF'
          import os, base64, json
          raw = os.environ["GCP_SA_KEY"].strip()
          try:
              decoded = base64.b64decode(raw).decode("utf-8")
              json.loads(decoded)
              raw = decoded
          except Exception:
              pass
          with open("/tmp/sa-key.json", "w") as f:
              f.write(raw)
          EOF
          gcloud auth activate-service-account --key-file=/tmp/sa-key.json
          gcloud config set project $PROJECT_ID
          echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/sa-key.json" >> $GITHUB_ENV

      - name: Terraform init
        run: cd terraform && terraform init

      - name: Terraform validate
        run: cd terraform && terraform validate

      - name: Terraform fmt check
        run: cd terraform && terraform fmt -check

      - name: Terraform apply
        run: cd terraform && terraform apply -auto-approve
        env:
          TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
          TF_VAR_jwt_secret:  ${{ secrets.JWT_SECRET }}
          TF_VAR_image_tag:   ${{ github.sha }}
