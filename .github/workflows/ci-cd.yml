name: CI/CD Mini-Chat

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:

  # ── JOB 1 : TESTS ────────────────────────────────────────────────
  tests:
    name: Tests et Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: ./backend
        run: npm ci

      - name: Lint
        working-directory: ./backend
        run: npm run lint || echo "No linter configured"

      - name: Tests
        working-directory: ./backend
        run: npm test || echo "No tests yet"


  # ── JOB 2 : BUILD & PUSH ECR ─────────────────────────────────────
  # Construit l'image Docker et la pousse dans ECR avec 2 tags :
  #   :latest      → toujours disponible pour référence rapide
  #   :<github.sha> → tracabilité exacte (quel commit = quelle image)
  build-push:
    name: Build and Push to ECR
    runs-on: ubuntu-latest
    needs: tests

    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-west-3

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push
        env:
          REGISTRY:   ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: mini-chat-backend
          TAG:        ${{ github.sha }}
        run: |
          docker build \
            -t $REGISTRY/$REPOSITORY:$TAG \
            -f backend/dockerfile.backend \
            backend/
          docker tag $REGISTRY/$REPOSITORY:$TAG $REGISTRY/$REPOSITORY:latest
          docker push $REGISTRY/$REPOSITORY:$TAG
          docker push $REGISTRY/$REPOSITORY:latest


  # ── JOB 3 : DEPLOY INFRASTRUCTURE + ECS ──────────────────────────
  # Terraform crée / met à jour toute l'infra.
  # TF_VAR_image_tag=${{ github.sha }} → ECS déploie exactement
  # la version buildée dans le job précédent (tracabilité totale).
  deploy:
    name: Deploy via Terraform
    runs-on: ubuntu-latest
    needs: build-push

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.5'

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-west-3

      - name: Terraform init
        run: cd terraform && terraform init

      - name: Terraform validate
        run: cd terraform && terraform validate

      - name: Terraform fmt check
        run: cd terraform && terraform fmt -check

      - name: Fix Terraform state conflicts
        run: |
          cd terraform
          terraform state rm 'aws_db_subnet_group.mini_chat_db_subnet_group' 2>/dev/null || true
          terraform state rm 'aws_db_subnet_group.mini_chat' 2>/dev/null || true
          terraform import aws_db_subnet_group.mini_chat mini-chat-db-subnet-group
        env:
          TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
          TF_VAR_jwt_secret:  ${{ secrets.JWT_SECRET }}
          TF_VAR_image_tag:   ${{ github.sha }}

      - name: Terraform apply
        run: cd terraform && terraform apply -auto-approve
        env:
          TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
          TF_VAR_jwt_secret:  ${{ secrets.JWT_SECRET }}
          TF_VAR_image_tag:   ${{ github.sha }}
