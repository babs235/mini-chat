services:
  # --- SERVICE 1 : LE BACKEND (Application Node.js) ---
  backend:
    build:
      context: ../backend
      dockerfile: dockerfile.backend
    ports:
      - "3000:3000"
    environment:
      DB_HOST: db
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      DB_NAME: mini_chat
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      db:
        condition: service_healthy  # ← Attend que MySQL soit prêt

  prometheus:
    image: prom/prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - ./prometheus/alerts:/etc/prometheus/alerts  # ALERTES
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana
    ports:
      - "3001:3000"

  # --- SERVICE 2 : LA BASE DE DONNÉES (MySQL) ---
  db:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: mini_chat
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ../database/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:  # ← AJOUTE LE HEALTHCHECK
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mysql_data: